name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version `requires-python = ">=3.11"` promises to support.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The frontend suite runs under Node's built-in test runner. It needs no
      # package manager and installs nothing -- but it does need Node, and
      # `tests/test_frontend_js.py` fails rather than skips when `CI` is set, so
      # pinning the version here is what keeps that suite from disappearing
      # quietly if a runner image changes.
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Every extra the complete suite needs. `dev` alone left FastAPI and
      # Uvicorn out on some paths, so the tests that start a real runtime
      # skipped -- and a green run said nothing about the launch path at all.
      - name: Install the project and every test dependency
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra web --extra media

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      # A skip in this set means a dependency or a test-order problem hid the
      # launch path, which is exactly what a green CI run must not be able to
      # do. Reported by name, and failed on.
      - name: Prove the runtime launch path actually ran
        run: uv run python tools/check_no_runtime_skips.py

      - name: Run the frontend suite
        run: uv run python tools/run_frontend_tests.py
