# Hermes plugin manifest.
#
# `name` is the plugin's identity in Hermes: it is the namespace for bundled
# skills (`learning-studio:adaptive-learning`) and must match the
# `hermes_agent.plugins` entry-point name in pyproject.toml so that directory
# installs and pip installs resolve to the same namespace.
name: learning-studio
version: 0.1.0
description: Generic adaptive-learning guidance for structured conversational study sessions in Hermes.
author: Victor Bonnet
kind: standalone

# The tools this plugin registers, in the `plugin_learning_studio` toolset.
# Hooks and slash commands are still not among them.
provides_tools:
  - learning_studio_get_context
  - learning_studio_save_context
  - learning_studio_prepare
  - learning_studio_import_asset
  - learning_studio_launch
  - learning_studio_status
  - learning_studio_results
  - learning_studio_stop
provides_hooks: []

# Deliberately empty, even though launching a Mini App needs a Telegram bot
# token. A non-empty `requires_env` gates the *whole plugin* off when the
# variable is unset — so declaring the token here would take the context,
# manifest, and asset tools away from every profile that never launches
# anything, which is most of them. The launch path reads the token where Hermes
# already keeps it and refuses with an explanation when it is absent.
requires_env: []
